name: Smoke Tests

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  smoke:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: stackrox-mcp-smoke

      - name: Resolve latest StackRox nightly tag
        id: stackrox-tag
        run: |
          # Quay returns tags newest first. Only the multi-arch tag is a manifest list (the -amd64/-arm64/... tags are not).
          tag="$(curl -fsSL 'https://quay.io/api/v1/repository/stackrox-io/main/tag/?limit=15&onlyActiveTags=true&filter_tag_name=like:nightly' \
            | jq -r '[.tags[] | select(.is_manifest_list) | .name] | first')"
          [[ -n "$tag" && "$tag" != "null" ]] || { echo "No nightly tag found"; exit 1; }
          echo "Using StackRox tag: ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Checkout StackRox repository
        uses: actions/checkout@v7
        with:
          repository: stackrox/stackrox
          path: stackrox-repo

      - name: Deploy StackRox with roxie
        env:
          SKIP_ROXIE_DEPLOY_BANNER: "true"
          STACKROX_TAG: ${{ steps.stackrox-tag.outputs.tag }}
        run: |
          cd stackrox-repo
          ./deploy/deploy.sh \
            --tag "${STACKROX_TAG}" \
            --envrc "${RUNNER_TEMP}/roxie.env" \
            --set roxie.imageRegistry=quay.io/stackrox-io \
            --resources small \
            --single-namespace \
            --central-wait 10m \
            --set central.spec.scannerV4.scannerComponent=Disabled \
            --set securedCluster.spec.scannerV4.scannerComponent=Disabled \
            --set securedCluster.spec.perNode.collector.collection=NoCollection \
            --set securedCluster.spec.admissionControl.enforcement=Disabled \
            --set securedCluster.spec.admissionControl.replicas=1

      - name: Extract Central password
        id: extract-password
        run: |
          # shellcheck source=/dev/null
          source "${RUNNER_TEMP}/roxie.env"
          echo "::add-mask::${ROX_ADMIN_PASSWORD}"
          echo "password=${ROX_ADMIN_PASSWORD}" >> "$GITHUB_OUTPUT"

      - name: Setup port-forward to Central
        run: stackrox-repo/scale/dev/port-forward.sh 8000

      - name: Install go-junit-report
        run: go install github.com/jstemmer/go-junit-report/v2@v2.1.0

      - name: Run smoke tests with JUnit output
        env:
          ROX_ENDPOINT: localhost:8000
          ROX_PASSWORD: ${{ steps.extract-password.outputs.password }}
        run: |
          go test -v -tags=smoke -cover -race -coverprofile=coverage-smoke.out -timeout=20m ./smoke 2>&1 | \
            tee /dev/stderr | \
            go-junit-report -set-exit-code -out junit-smoke.xml

      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-smoke-results
          path: junit-smoke.xml
          if-no-files-found: error

      - name: Upload test results to Codecov
        if: always()
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit-smoke.xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage-smoke.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: smoke
          name: smoke-tests

      - name: Collect logs
        if: always()
        run: |
          mkdir -p logs
          kubectl get pods -A > logs/pods.txt || true
          kubectl get events -A --sort-by='.lastTimestamp' > logs/events.txt || true
          kubectl logs -n stackrox deployment/central > logs/central.log || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-logs
          path: logs/
          if-no-files-found: ignore
